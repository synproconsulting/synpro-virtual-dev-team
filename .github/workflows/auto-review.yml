name: Auto Review and Merge

on:
  # Trigger when all CI checks complete on a PR
  check_suite:
    types: [completed]
  # Also allow manual trigger for testing
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review (leave blank for all open PRs)'
        required: false
        default: ''

jobs:
  auto-review:
    name: Manager Agent review
    runs-on: ubuntu-latest
    # Only run when checks succeed and it's on a PR branch (not main)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.check_suite.conclusion == 'success' &&
       github.event.check_suite.head_branch != 'main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find PR for this commit
        id: find_pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.pr_number }}" ]; then
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            # Find open PR matching this branch/commit
            BRANCH="${{ github.event.check_suite.head_branch }}"
            PR=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:${BRANCH}" \
              | python3 -c "import sys,json; prs=json.load(sys.stdin); print(prs[0]['number'] if prs else '')")
            if [ -n "$PR" ]; then
              echo "pr_number=$PR" >> $GITHUB_OUTPUT
              echo "found=true" >> $GITHUB_OUTPUT
              echo "Found PR #$PR for branch $BRANCH"
            else
              echo "found=false" >> $GITHUB_OUTPUT
              echo "No open PR found for branch $BRANCH"
            fi
          fi

      - name: Run Manager Agent
        if: steps.find_pr.outputs.found == 'true'
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          JIRA_BASE_URL:      ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL:         ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:     ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY:   ${{ secrets.JIRA_PROJECT_KEY }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME:    ${{ github.repository_owner }}
          GITHUB_REPO:        ${{ github.event.repository.name }}
          OPENAI_API_KEY:     sk-no-openai-needed
        run: |
          echo "Running Manager Agent on PR #${{ steps.find_pr.outputs.pr_number }}"
          python main.py --agent manager --task review \
            --pr ${{ steps.find_pr.outputs.pr_number }}

      - name: Skip â€” no PR found
        if: steps.find_pr.outputs.found != 'true'
        run: echo "No open PR found for this commit â€” skipping Manager Agent"
