name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  # â”€â”€ Job 1: Unit tests + coverage â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          find . -name "requirements*.txt" -not -path "./.git/*" \
            -exec pip install -r {} \; 2>/dev/null || true

      - name: Lint with flake8
        run: |
          if [ -d uat/backend ]; then
            flake8 uat/backend/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
            flake8 uat/backend/ --count --max-line-length=120 --statistics --exit-zero
          else
            echo "No uat/backend/ directory - skipping lint"
          fi

      - name: Run tests with coverage
        run: |
          if [ -d uat/backend/tests ]; then
            pytest uat/backend/tests/ \
              --cov=uat/backend \
              --cov-report=xml \
              --cov-report=term-missing \
              --tb=short \
              -v || true
          else
            echo "No uat/backend/tests/ directory - skipping tests"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # â”€â”€ Job 2: Security scan â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        run: |
          if [ -d uat/backend ]; then
            bandit -r uat/backend/ -f json -o bandit-report.json --exit-zero
          else
            echo "No uat/backend/ directory - skipping security scan"
            echo "{}" > bandit-report.json
          fi

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          if-no-files-found: ignore

  # â”€â”€ Job 3: SonarCloud analysis (informational only, not blocking) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for blame info

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and run coverage
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          find . -name "requirements*.txt" -not -path "./.git/*" \
            -exec pip install -r {} \; 2>/dev/null || true
          if [ -d uat/backend/tests ]; then
            pytest uat/backend/tests/ --cov=uat/backend --cov-report=xml -q || true
          fi

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # â”€â”€ Job 4: Playwright E2E tests â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true   # non-blocking: reports results but won't fail the pipeline

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-playwright fastapi uvicorn httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          find . -name "requirements*.txt" -not -path "./.git/*" \
            -exec pip install -r {} \; 2>/dev/null || true

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run E2E tests
        run: |
          if [ -d tests/e2e ]; then
            pytest tests/e2e/ \
              --tb=short \
              -v \
              --timeout=30 \
              || true
          else
            echo "No E2E tests yet - skipping"
          fi

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore

  # â”€â”€ Job 5: Quality gate summary â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [test, security, e2e]
    if: always()

    steps:
      - name: Quality gate summary
        run: |
          echo "================================"
          echo "  CI Quality Gate Summary"
          echo "  Unit tests:   ${{ needs.test.result }}"
          echo "  Security:     ${{ needs.security.result }}"
          echo "  SonarCloud:   (see SonarCloud dashboard - non-blocking)"
          echo "  E2E tests:    ${{ needs.e2e.result }}"
          echo "================================"
          echo "Ready for Dev Manager review."

  # â”€â”€ Job 6: Deploy to Railway (main branch only) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend via Railway API
        env:
          RAILWAY_TOKEN:      ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "Querying Railway project for service and environment IDs..."
          RESP=$(curl -sf -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"{ project(id: \\\"$RAILWAY_PROJECT_ID\\\") { environments { edges { node { id name } } } services { edges { node { id name } } } } }\"}")
          if [ -z "$RESP" ]; then echo "Railway API unreachable — skipping backend deploy"; exit 0; fi
          ENV_ID=$(echo "$RESP" | jq -r '.data.project.environments.edges[] | select(.node.name=="production") | .node.id')
          SVC_ID=$(echo "$RESP" | jq -r '.data.project.services.edges[] | select(.node.name=="synpro-virtual-dev-team") | .node.id')
          if [ -z "$ENV_ID" ] || [ "$ENV_ID" = "null" ]; then echo "Production environment not found — skipping"; exit 0; fi
          if [ -z "$SVC_ID" ] || [ "$SVC_ID" = "null" ]; then echo "Backend service not found — skipping"; exit 0; fi
          echo "Triggering backend redeploy (svc=$SVC_ID env=$ENV_ID)..."
          REDEPLOY=$(curl -sf -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceRedeploy(environmentId: \\\"$ENV_ID\\\", serviceId: \\\"$SVC_ID\\\") }\"}")
          echo "Backend redeploy response: $REDEPLOY"

      - name: Deploy frontend via Railway API
        env:
          RAILWAY_TOKEN:      ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          echo "Querying Railway project for service and environment IDs..."
          RESP=$(curl -sf -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"{ project(id: \\\"$RAILWAY_PROJECT_ID\\\") { environments { edges { node { id name } } } services { edges { node { id name } } } } }\"}")
          if [ -z "$RESP" ]; then echo "Railway API unreachable — skipping frontend deploy"; exit 0; fi
          ENV_ID=$(echo "$RESP" | jq -r '.data.project.environments.edges[] | select(.node.name=="production") | .node.id')
          SVC_ID=$(echo "$RESP" | jq -r '.data.project.services.edges[] | select(.node.name=="Virtual-Dev-Team-UAT-Frontend") | .node.id')
          if [ -z "$ENV_ID" ] || [ "$ENV_ID" = "null" ]; then echo "Production environment not found — skipping"; exit 0; fi
          if [ -z "$SVC_ID" ] || [ "$SVC_ID" = "null" ]; then echo "Frontend service not found — skipping"; exit 0; fi
          echo "Triggering frontend redeploy (svc=$SVC_ID env=$ENV_ID)..."
          REDEPLOY=$(curl -sf -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceRedeploy(environmentId: \\\"$ENV_ID\\\", serviceId: \\\"$SVC_ID\\\") }\"}")
          echo "Frontend redeploy response: $REDEPLOY"


