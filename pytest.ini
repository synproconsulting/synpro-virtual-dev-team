[pytest]
markers =
    integration: marks tests as integration tests requiring live Jira connection (deselect with '-m "not integration"')
    unit: marks tests as unit tests (select with '-m unit')

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show extra test summary info
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes

# Integration test warnings
filterwarnings =
    ignore::DeprecationWarning
