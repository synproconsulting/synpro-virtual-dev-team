# Kubernetes Secret Template for SDT1 Platform
# 
# This template shows the structure of the secrets used by SDT1 services.
# DO NOT commit actual secret values to version control.
#
# To create/update the secret:
#   kubectl apply -f sdt1-secrets.yaml -n <environment>
#
# To view existing secret:
#   kubectl get secret sdt1-secrets -n production -o yaml
#
# To decode a secret value:
#   kubectl get secret sdt1-secrets -n production -o jsonpath='{.data.JIRA_API_TOKEN}' | base64 -d

apiVersion: v1
kind: Secret
metadata:
  name: sdt1-secrets
  namespace: production  # Change to: development, staging, or production
  labels:
    app: sdt1
    managed-by: operations
type: Opaque

# Secret values must be base64 encoded
# To encode: echo -n 'your-secret-value' | base64
# To decode: echo 'base64-encoded-value' | base64 -d

data:
  # Jira API Token
  # Generate at: https://id.atlassian.com/manage-profile/security/api-tokens
  # Format: base64 encoded token string
  JIRA_API_TOKEN: <base64-encoded-jira-token>

  # Jira Configuration
  JIRA_BASE_URL: <base64-encoded-url>  # e.g., https://your-domain.atlassian.net
  JIRA_EMAIL: <base64-encoded-email>   # Service account email

  # OpenAI API Key
  # Generate at: https://platform.openai.com/api-keys
  # Format: base64 encoded key starting with 'sk-'
  OPENAI_API_KEY: <base64-encoded-openai-key>

  # GitHub Personal Access Token
  # Generate at: https://github.com/settings/tokens
  # Required scopes: repo, workflow, read:org
  # Format: base64 encoded token starting with 'ghp_'
  GITHUB_TOKEN: <base64-encoded-github-token>
  GITHUB_REPO: <base64-encoded-repo-name>  # e.g., organization/repository

  # JWT Secret Key
  # Generate with: python3 -c "import secrets; print(secrets.token_urlsafe(64))"
  # Minimum length: 32 characters (recommend 64+)
  JWT_SECRET_KEY: <base64-encoded-jwt-secret>
  
  # During JWT rotation, these temporary keys are used:
  # JWT_SECRET_KEY_NEW: <base64-encoded-new-secret>  # Phase 1: Added as secondary
  # JWT_SECRET_KEY_OLD: <base64-encoded-old-secret>  # Phase 2: Kept as fallback

  # JWT Configuration
  JWT_ALGORITHM: SFMyNTY=  # HS256 (base64)
  JWT_EXPIRATION_HOURS: MjQ=  # 24 (base64)

  # Database Configuration
  DATABASE_HOST: <base64-encoded-host>
  DATABASE_PORT: NTQzMg==  # 5432 (base64)
  DATABASE_NAME: <base64-encoded-db-name>
  DATABASE_USER: <base64-encoded-username>
  DATABASE_PASSWORD: <base64-encoded-password>
  
  # Redis Configuration
  REDIS_HOST: <base64-encoded-host>
  REDIS_PORT: NjM3OQ==  # 6379 (base64)
  REDIS_PASSWORD: <base64-encoded-password>
  REDIS_DB: MA==  # 0 (base64)

  # Optional: Additional service tokens
  # SLACK_WEBHOOK_URL: <base64-encoded-webhook>
  # DATADOG_API_KEY: <base64-encoded-api-key>
  # SENTRY_DSN: <base64-encoded-dsn>

---

# Example: Creating secret from command line
# 
# kubectl create secret generic sdt1-secrets \
#   --namespace=production \
#   --from-literal=JIRA_API_TOKEN='your-jira-token' \
#   --from-literal=JIRA_BASE_URL='https://your-domain.atlassian.net' \
#   --from-literal=JIRA_EMAIL='service@example.com' \
#   --from-literal=OPENAI_API_KEY='sk-your-openai-key' \
#   --from-literal=GITHUB_TOKEN='ghp_your-github-token' \
#   --from-literal=GITHUB_REPO='org/repo' \
#   --from-literal=JWT_SECRET_KEY='your-jwt-secret' \
#   --from-literal=JWT_ALGORITHM='HS256' \
#   --from-literal=JWT_EXPIRATION_HOURS='24' \
#   --from-literal=DATABASE_HOST='db.example.com' \
#   --from-literal=DATABASE_PORT='5432' \
#   --from-literal=DATABASE_NAME='sdt1_db' \
#   --from-literal=DATABASE_USER='sdt1_user' \
#   --from-literal=DATABASE_PASSWORD='your-db-password' \
#   --from-literal=REDIS_HOST='redis.example.com' \
#   --from-literal=REDIS_PORT='6379' \
#   --from-literal=REDIS_PASSWORD='your-redis-password' \
#   --from-literal=REDIS_DB='0' \
#   --dry-run=client -o yaml | kubectl apply -f -

---

# Example: Updating a single secret value
#
# 1. Get current secret
#    kubectl get secret sdt1-secrets -n production -o json > current-secret.json
#
# 2. Decode, update, re-encode the value
#    NEW_VALUE=$(echo -n 'new-token-value' | base64)
#
# 3. Patch the secret
#    kubectl patch secret sdt1-secrets -n production \
#      --type='json' \
#      -p="[{'op': 'replace', 'path': '/data/JIRA_API_TOKEN', 'value': '$NEW_VALUE'}]"

---

# Security Best Practices:
#
# 1. Use separate secrets for each environment (development, staging, production)
# 2. Rotate tokens regularly (90 days for API tokens, 180 days for JWT secrets)
# 3. Use strong, randomly generated secrets (minimum 32 characters)
# 4. Never commit actual secret values to version control
# 5. Use RBAC to restrict who can read secrets
# 6. Enable audit logging for secret access
# 7. Use secret management tools (Vault, AWS Secrets Manager) for production
# 8. Backup secrets securely before rotation
# 9. Monitor for unauthorized secret access
# 10. Revoke old tokens immediately after successful rotation
