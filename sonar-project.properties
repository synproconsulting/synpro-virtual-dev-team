sonar.projectKey=synproconsulting_synpro-virtual-dev-team
sonar.organization=synproconsulting

sonar.projectName=SynPro Virtual Dev Team
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src
sonar.tests=tests
sonar.language=py

# Coverage report (generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/migrations/**

# Quality gate thresholds
sonar.qualitygate.wait=true
sonar.python.version=3.12
