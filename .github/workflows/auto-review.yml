name: Auto Review and Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: false
        default: ''

jobs:
  wait-and-review:
    name: Manager Agent review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic requests python-dotenv

      - name: Wait for CI checks to complete
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=${{ github.event.pull_request.head.sha }}
          echo "Waiting for CI checks on sha: $SHA"
          for i in $(seq 1 90); do
            sleep 10
            CHECKS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/commits/$SHA/check-runs")
            TOTAL=$(echo "$CHECKS" | python3 -c "
import sys,json
runs=[r for r in json.load(sys.stdin).get('check_runs',[]) if r['name'] not in ('Manager Agent review','Wait for CI then review')]
print(len(runs))")
            COMPLETED=$(echo "$CHECKS" | python3 -c "
import sys,json
runs=[r for r in json.load(sys.stdin).get('check_runs',[]) if r['name'] not in ('Manager Agent review','Wait for CI then review') and r['status']=='completed']
print(len(runs))")
            FAILED=$(echo "$CHECKS" | python3 -c "
import sys,json
runs=[r for r in json.load(sys.stdin).get('check_runs',[]) if r['name'] not in ('Manager Agent review','Wait for CI then review') and r.get('conclusion') in ('failure','cancelled','timed_out')]
print(len(runs))")
            echo "Attempt $i: $COMPLETED/$TOTAL completed, $FAILED failed"
            if [ "$TOTAL" -gt "0" ] && [ "$COMPLETED" -eq "$TOTAL" ]; then
              if [ "$FAILED" -gt "0" ]; then
                echo "CI failed — skipping review"
                exit 0
              fi
              echo "CI_PASSED=true" >> $GITHUB_ENV
              break
            fi
          done

      - name: Set PR for manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: echo "CI_PASSED=true" >> $GITHUB_ENV

      - name: Run Manager Agent
        if: env.CI_PASSED == 'true'
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          JIRA_BASE_URL:      ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL:         ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:     ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY:   ${{ secrets.JIRA_PROJECT_KEY }}
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME:    ${{ github.repository_owner }}
          GITHUB_REPO:        ${{ github.event.repository.name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUM="${{ github.event.inputs.pr_number }}"
          else
            PR_NUM="${{ github.event.pull_request.number }}"
          fi
          echo "Running Manager Agent on PR #$PR_NUM"
          python ci_manager_agent.py --pr $PR_NUM
