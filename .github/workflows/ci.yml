name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  # ── Job 1: Unit tests + coverage ─────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          find . -name "requirements*.txt" -not -path "./.git/*" \
            -exec pip install -r {} \; 2>/dev/null || true

      - name: Lint with flake8
        run: |
          if [ -d uat/backend ]; then
            flake8 uat/backend/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
            flake8 uat/backend/ --count --max-line-length=120 --statistics --exit-zero
          else
            echo "No uat/backend/ directory - skipping lint"
          fi

      - name: Run tests with coverage
        run: |
          if [ -d uat/backend/tests ]; then
            pytest uat/backend/tests/ \
              --cov=uat/backend \
              --cov-report=xml \
              --cov-report=term-missing \
              --tb=short \
              -v || true
          else
            echo "No uat/backend/tests/ directory - skipping tests"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # ── Job 2: Security scan ─────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit security scan
        run: |
          if [ -d uat/backend ]; then
            bandit -r uat/backend/ -f json -o bandit-report.json --exit-zero
          else
            echo "No uat/backend/ directory - skipping security scan"
            echo "{}" > bandit-report.json
          fi

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          if-no-files-found: ignore

  # ── Job 4: Playwright E2E tests ──────────────────────────────────────────
  e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true   # non-blocking: reports results but won't fail the pipeline

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-playwright fastapi uvicorn httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          find . -name "requirements*.txt" -not -path "./.git/*" \
            -exec pip install -r {} \; 2>/dev/null || true

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run E2E tests
        run: |
          if [ -d tests/e2e ]; then
            pytest tests/e2e/ \
              --tb=short \
              -v \
              --timeout=30 \
              || true
          else
            echo "No E2E tests yet - skipping"
          fi

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore

  # ── Job 6: Validate Railway API connectivity ─────────────────────────────
  validate-railway:
    name: Validate Railway API
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate Railway API connectivity
        env:
          RAILWAY_TOKEN:      ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          python uat/backend/railway_deploy_validator.py
          if [ $? -ne 0 ]; then
            echo "::error::Railway API validation failed"
            exit 1
          fi

  # ── Job 7: Deploy to Railway with validation and alerting ───────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, security, validate-railway]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Deploy services with validation
        env:
          RAILWAY_TOKEN:      ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_SERVER_URL:  ${{ github.server_url }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          GITHUB_RUN_ID:      ${{ github.run_id }}
        run: |
          chmod +x scripts/deploy_railway_validated.py
          python scripts/deploy_railway_validated.py \
            --services synpro-virtual-dev-team Virtual-Dev-Team-UAT-Frontend \
            --environment production \
            --commit-sha ${{ github.sha }} \
            --branch ${{ github.ref_name }}

      - name: Report deployment status
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d '{
                "attachments": [{
                  "color": "#ff0000",
                  "title": "Railway Deployment Failed",
                  "text": "❌ Railway deployment pipeline failed",
                  "fields": [
                    {
                      "title": "Repository",
                      "value": "${{ github.repository }}",
                      "short": true
                    },
                    {
                      "title": "Branch",
                      "value": "${{ github.ref_name }}",
                      "short": true
                    },
                    {
                      "title": "Commit",
                      "value": "${{ github.sha }}",
                      "short": false
                    },
                    {
                      "title": "Build URL",
                      "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "short": false
                    }
                  ],
                  "footer": "Railway CI/CD Pipeline"
                }]
              }'
          fi
