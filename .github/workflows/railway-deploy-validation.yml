name: Railway GraphQL Deploy - Validation & Alerting

on:
  push:
    branches:
      - main
    paths:
      - 'uat/backend/**'
      - '.github/workflows/railway-deploy-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'uat/backend/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  validate-graphql-schema:
    name: Validate GraphQL Schema & Queries
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        working-directory: uat/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install graphql-core
      
      - name: Validate GraphQL queries
        working-directory: uat/backend
        run: |
          python -m pytest tests/test_railway_graphql_validation.py -v
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      
      - name: Report validation failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_body = `## ⚠️ Railway GraphQL Validation Failed
            
            **Workflow:** ${context.workflow}
            **Run:** [${context.runNumber}](${context.payload.repository.html_url}/actions/runs/${context.runId})
            **Commit:** ${context.sha.substring(0, 7)}
            **Author:** @${context.actor}
            
            GraphQL schema validation or query validation has failed. Please review the workflow logs.
            
            ### Action Items
            - [ ] Review GraphQL queries in \`railway_api.py\`
            - [ ] Verify Railway API schema compatibility
            - [ ] Check for deprecated fields or mutations
            
            **Auto-generated by Railway Deploy Validation workflow**`;
            
            // Create or update issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'railway-validation-failure'
            });
            
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: issue_body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Railway GraphQL Validation Failed',
                body: issue_body,
                labels: ['railway-validation-failure', 'ci-alert', 'bug']
              });
            }

  test-railway-integration:
    name: Test Railway API Integration
    runs-on: ubuntu-latest
    needs: validate-graphql-schema
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        working-directory: uat/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Railway API tests
        working-directory: uat/backend
        run: |
          python -m pytest tests/test_railway_api.py -v --cov=railway_api --cov-report=json
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./uat/backend/coverage.json
          flags: railway-api
          name: railway-api-coverage
      
      - name: Alert on test failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_body = `## 🚨 Railway API Integration Tests Failed
            
            **Workflow:** ${context.workflow}
            **Run:** [${context.runNumber}](${context.payload.repository.html_url}/actions/runs/${context.runId})
            **Commit:** ${context.sha.substring(0, 7)}
            **Author:** @${context.actor}
            
            Railway API integration tests have failed. This may indicate breaking changes in the Railway API or issues with our client implementation.
            
            ### Action Items
            - [ ] Review test failures in workflow logs
            - [ ] Check Railway API documentation for changes
            - [ ] Verify RAILWAY_API_TOKEN is valid
            - [ ] Update client implementation if needed
            
            **Auto-generated by Railway Deploy Validation workflow**`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Railway API Integration Tests Failed',
              body: issue_body,
              labels: ['railway-test-failure', 'ci-alert', 'bug']
            });

  validate-deployment-health:
    name: Validate Railway Deployment Health
    runs-on: ubuntu-latest
    needs: test-railway-integration
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        working-directory: uat/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check Railway deployment health
        working-directory: uat/backend
        run: |
          python scripts/check_railway_health.py
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      
      - name: Alert on unhealthy deployments
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "⚠️ Railway Deployment Health Check Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "⚠️ Railway Deployment Health Check Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n${{ github.workflow }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n<${{ github.event.head_commit.url }}|${{ github.sha }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Railway deployment health check has failed. One or more deployments may be in a failed state."
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

  deployment-metrics:
    name: Collect Deployment Metrics
    runs-on: ubuntu-latest
    needs: validate-deployment-health
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        working-directory: uat/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Collect deployment metrics
        working-directory: uat/backend
        run: |
          python scripts/collect_deployment_metrics.py
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      
      - name: Upload metrics artifact
        uses: actions/upload-artifact@v3
        with:
          name: deployment-metrics
          path: uat/backend/metrics.json
          retention-days: 30
      
      - name: Post metrics summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const metricsPath = 'uat/backend/metrics.json';
            
            if (fs.existsSync(metricsPath)) {
              const metrics = JSON.parse(fs.readFileSync(metricsPath, 'utf8'));
              
              const summary = `## 📊 Railway Deployment Metrics
              
              **Total Deployments:** ${metrics.total_deployments || 0}
              **Successful:** ${metrics.successful_deployments || 0}
              **Failed:** ${metrics.failed_deployments || 0}
              **Success Rate:** ${metrics.success_rate || 'N/A'}
              
              **Average Build Time:** ${metrics.avg_build_time || 'N/A'}
              **Latest Deployment:** ${metrics.latest_deployment_status || 'N/A'}
              
              _Metrics collected from the last 30 days_`;
              
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: summary
              });
            }

  notify-success:
    name: Notify Validation Success
    runs-on: ubuntu-latest
    needs: [validate-graphql-schema, test-railway-integration, validate-deployment-health]
    if: success() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Send success notification
        uses: slackapi/slack-github-action@v1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ Railway GraphQL Deploy Validation Passed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ Railway GraphQL Deploy Validation Passed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "All Railway deployment validations have passed successfully."
                  }
                }
              ]
            }
